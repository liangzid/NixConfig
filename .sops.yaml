# sops-nix 加密规则（per-host）
#
# 每个 host 一份密文 secrets/hosts/<hostname>.yaml，各用各的公钥加密，
# 只有对应设备的私钥能解密。密文进 git 是安全的（age 加密）。
#
# 每把 ~/.ssh/id_ed25519 注册两种接收者形式（密钥相同）：
# 1. age1...：nixpkgs 的 ssh-to-age（Go）输出，BIP-173 bech32；
#    激活时由 SSH 私钥生成 AGE-SECRET-KEY 解密标准 X25519 stanza。
# 2. ssh-ed25519 公钥原文：sops 3.9+ 原生支持，供
#    `sops -d --age ~/.ssh/id_ed25519` 编辑/解密时直接使用。
#
# 注意：不要用 Rust 版 ssh-to-age crate 的输出来替换本文件，它输出
# bech32m 编码，实测会被 sops 3.13 拒绝（invalid checksum）。
#
# 加新设备：在新设备上跑 scripts/set-secret.sh NAME VALUE（会自动追加
# 该设备的公钥锚点 + 对应 path_regex 规则），或手动照 nixos 的格式追加。
keys:
- &nixos_age age1dd25x92re3d69zzlucm4zhmuwhatrqmp05nrl0dfuvxytjwlfsrqwdelmr
- &nixos_ssh ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILSs6JEpbdU/reE3qrMsoYTlcoD9rC3g2Lb6GmhhspFL

creation_rules:
  - path_regex: secrets/hosts/nixos\.yaml$
    key_groups:
      - age:
          - *nixos_age
          - *nixos_ssh
