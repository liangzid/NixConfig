# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

# Syntax: monitor=name,resolution,position,scale
monitor=,preferred,auto,1.5

# 光标主题与尺寸（GTK 侧由 gtk.nix 的 settings.ini 指定，这里覆盖 XWayland/Qt）
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Numix-Cursor

# 关键：同步环境变量到 dbus 和 systemd，解决 GTK 软件启动慢或权限问题
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar & dunst & udiskie -t
exec-once = fcitx5 -d --replace
exec-once = bash $HOME/scripts/wallpaper-picker.sh 
exec-once = nm-applet --indicator

# 玻璃拟态：让 waybar / wofi / dunst 后面的内容模糊
# 0.52+ 新语法：字段带值 + match:namespace（旧写法 layerrule = blur, xxx 已失效）
layerrule = blur on, ignore_alpha 0.5, match:namespace waybar
layerrule = blur on, ignore_alpha 0.5, match:namespace wofi
layerrule = blur on, ignore_alpha 0.5, match:namespace dunst

# 终端不参与 blur，保持清晰可读
windowrule = no_blur on, match:class ^(com\.mitchellh\.ghostty)$

# 聚焦窗口强调：边框加粗 + 高亮渐变（替代原来的 dim 变暗效果）
windowrule = border_size 3, match:focus true
windowrule = border_color rgba(7dcfffee) rgba(bb9af7ee) 45deg, match:focus true

$lock_cmd = swaylock -f -S --effect-blur 7x5 --effect-vignette 0.3:0.4

# Auto-lock on idle is intentionally disabled. Display still powers off after
# 600s, and the screen is still locked on suspend / lid close.
exec-once = swayidle -w \
    timeout 600 'hyprctl dispatch dpms off' \
    resume 'hyprctl dispatch dpms on' \
    before-sleep '$lock_cmd'

bindl=, switch:on:Lid Switch, exec, $lock_cmd


$mainMod = SUPER
$terminal = ghostty
$menu = wofi --show drun



# For moving focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Tab, cyclenext

# K for kill window, V for floating, F for Fullscreen (and back),
# T for terminal, X for menu (like emacs), E for Explorer
bind = $mainMod, K, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, X, exec, $menu
bind = $mainMod, E, exec, nautilus

# Q for quit.
bind = $mainMod, Q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# Swap between windows
bind = $mainMod ALT, left, movewindow, l
bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, up, movewindow, u
bind = $mainMod ALT, down, movewindow, d

# For resize
bind = $mainMod, R, submap, resize
submap = resize
    binde = , right, resizeactive, 10 0
    binde = , left, resizeactive, -10 0
    binde = , up, resizeactive, 0 -10
    binde = , down, resizeactive, 0 10

    binde = , L, resizeactive, 10 0
    binde = , H, resizeactive, -10 0
    binde = , K, resizeactive, 0 -10
    binde = , J, resizeactive, 0 10

    bind = , escape, submap, reset
    bind = , enter, submap, reset
submap = reset


# Switching between workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 0

# Moving current window among workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 0


# Super + L (Lock) 
bind = $mainMod, L, exec, $lock_cmd
# bind = $mainMod, L, exec, swaylock -f -c 000000
# bind = $mainMod, L, exec, notify-send "Lock" "Super+L pressed"


# 窗口装饰：Tokyo Night 主题色 + 圆角 + 阴影 + 背景模糊
general {
    gaps_in = 4
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(7dcfffee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(3b4261cc)
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000080)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.2
        new_optimizations = true
        xray = true
        ignore_opacity = true
    }

    glow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(7dcfffcc) rgba(bb9af7cc) 45deg
        color_inactive = rgba(3b426180)
    }

    motion_blur {
        enabled = true
        samples = 7
    }
}

animations {
    enabled = true
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1

    # speed 单位 = 0.1s；数值越大动画时间越长（本档比上版再长 40%~60%）
    animation = global, 1, 8, easeOutCubic
    animation = windows, 1, 12, easeOutBack, popin 85%
    animation = windowsIn, 1, 12, easeOutBack, popin 85%
    animation = windowsOut, 1, 8, easeOutCubic, popin 90%
    animation = windowsMove, 1, 8, easeOutCubic
    animation = border, 1, 10, easeOutCubic
    animation = borderangle, 1, 120, linear, loop
    animation = glowangle, 1, 120, linear, loop
    animation = fade, 1, 8, easeOutCubic
    animation = fadeIn, 1, 8, easeOutCubic
    animation = fadeOut, 1, 7, easeOutCubic
    animation = fadeSwitch, 1, 7, easeOutCubic
    animation = fadeShadow, 1, 7, easeOutCubic
    animation = fadeGlow, 1, 7, easeOutCubic
    animation = fadeLayers, 1, 7, easeOutCubic
    animation = fadeLayersIn, 1, 7, easeOutCubic
    animation = fadeLayersOut, 1, 7, easeOutCubic
    animation = fadePopupsIn, 1, 7, easeOutCubic
    animation = fadePopupsOut, 1, 7, easeOutCubic
    animation = layers, 1, 8, easeOutCubic, fade
    animation = layersIn, 1, 8, easeOutCubic, fade
    animation = layersOut, 1, 7, easeOutCubic, fade
    animation = workspaces, 1, 12, easeOutCubic, slidefade 20%
    animation = workspacesIn, 1, 9, easeOutCubic, slidefade 20%
    animation = workspacesOut, 1, 8, easeOutCubic, slidefade 20%
    animation = specialWorkspace, 1, 9, easeOutBack, slidefade
    animation = zoomFactor, 1, 8, easeOutCubic
}

misc {
    disable_hyprland_logo = true
}

# For screen Capture
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = , XF86Calculator, exec, grim -g "$(slurp)" - | swappy -f -
bind = CTRL, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Fullscreen captured"
bind = CTRL, XF86Calculator, exec, grim - | wl-copy && notify-send "Screenshot" "Fullscreen captured"

# Disable scaling
xwayland {
  force_zero_scaling = true
}
